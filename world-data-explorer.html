<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Data Explorer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#060810;
  --surface:#0d1117;
  --card:#111827;
  --border:#1e2533;
  --text:#e8eaf0;
  --muted:#5a6478;
  --accent:#4f9cf9;
  --glow:rgba(79,156,249,0.15);
}
body{
  font-family:'Syne',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(79,156,249,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 90% 90%, rgba(139,92,246,0.05) 0%, transparent 50%);
  pointer-events:none;z-index:0;
}

/* HEADER */
header{
  position:relative;z-index:10;
  padding:20px 32px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
  background:rgba(6,8,16,0.8);
  backdrop-filter:blur(20px);
}
.logo{
  font-size:1.1rem;font-weight:700;letter-spacing:-.02em;
  display:flex;align-items:center;gap:10px;
}
.logo-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 12px var(--accent);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.6;transform:scale(.8);}}
.logo span{color:var(--muted);font-weight:400;}

/* METRICS SELECTOR */
.metrics{display:flex;gap:4px;}
.metric-btn{
  padding:6px 14px;border-radius:6px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--muted);
  font-family:'Syne',sans-serif;
  font-size:.75rem;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;
  cursor:pointer;transition:all .2s;
}
.metric-btn:hover{border-color:rgba(79,156,249,.4);color:var(--text);}
.metric-btn.active{
  background:rgba(79,156,249,.12);
  border-color:rgba(79,156,249,.5);
  color:var(--accent);
}

/* MAIN LAYOUT */
.app{
  position:relative;z-index:1;
  display:grid;
  grid-template-columns:1fr 340px;
  height:calc(100vh - 65px);
}

/* MAP CONTAINER */
.map-wrap{
  position:relative;overflow:hidden;
}
.map-wrap svg{width:100%;height:100%;}

/* Country paths */
.country{
  fill:#1a2035;
  stroke:#0d1117;
  stroke-width:0.5;
  cursor:pointer;
  transition:filter .15s;
}
.country:hover{filter:brightness(1.4);}
.country.selected{
  stroke:#4f9cf9;
  stroke-width:1.5;
  filter:brightness(1.3);
}

/* GRATICULE */
.graticule{fill:none;stroke:#111827;stroke-width:.3;}
.sphere{fill:#060d1a;}

/* TOOLTIP */
#tooltip{
  position:fixed;
  pointer-events:none;
  z-index:100;
  background:rgba(13,17,23,.95);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 14px;
  min-width:180px;
  opacity:0;
  transform:translate(-50%,-110%) scale(.95);
  transition:opacity .15s, transform .15s;
  backdrop-filter:blur(20px);
}
#tooltip.show{opacity:1;transform:translate(-50%,-110%) scale(1);}
.tip-name{font-size:.9rem;font-weight:700;margin-bottom:8px;letter-spacing:-.01em;}
.tip-flag{font-size:1.4rem;margin-right:6px;}
.tip-row{display:flex;justify-content:space-between;gap:16px;margin-bottom:3px;align-items:center;}
.tip-label{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.tip-val{font-family:'DM Mono',monospace;font-size:.8rem;color:var(--accent);}

/* SIDEBAR */
.sidebar{
  background:var(--surface);
  border-left:1px solid var(--border);
  overflow-y:auto;
  overflow-x:hidden;
  display:flex;
  flex-direction:column;
}
.sidebar::-webkit-scrollbar{width:4px;}
.sidebar::-webkit-scrollbar-track{background:transparent;}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* COUNTRY DETAIL */
.detail-header{
  padding:24px 24px 20px;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;
  background:var(--surface);z-index:5;
}
.detail-flag{font-size:2.2rem;margin-bottom:8px;}
.detail-name{font-size:1.35rem;font-weight:800;letter-spacing:-.03em;margin-bottom:2px;}
.detail-region{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}

.stats-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;padding:20px;
}
.stat-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px;
}
.stat-label{font-size:.63rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
.stat-val{font-family:'DM Mono',monospace;font-size:1.1rem;font-weight:500;color:var(--text);}
.stat-sub{font-size:.65rem;color:var(--muted);margin-top:2px;}

/* SPARKBAR */
.bar-row{padding:0 20px 6px;}
.bar-label{display:flex;justify-content:space-between;margin-bottom:5px;}
.bar-label span:first-child{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;}
.bar-label span:last-child{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--accent);}
.bar-track{height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.16,1,.3,1);}

/* RANKING LIST */
.rank-section{padding:20px;}
.rank-title{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;}
.rank-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,.03);
  cursor:pointer;
  transition:opacity .15s;
}
.rank-item:hover{opacity:.7;}
.rank-num{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--muted);min-width:20px;}
.rank-flag{font-size:1rem;}
.rank-name{font-size:.82rem;font-weight:600;flex:1;}
.rank-val{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--accent);}

/* LEGEND */
.legend{
  position:absolute;bottom:20px;left:24px;
  background:rgba(13,17,23,.8);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px 16px;
  backdrop-filter:blur(10px);
}
.legend-title{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
.legend-bar{
  width:200px;height:6px;border-radius:3px;
  background:linear-gradient(to right, #111827, #1d4ed8, #60a5fa, #93c5fd, #dbeafe);
  margin-bottom:5px;
}
.legend-labels{display:flex;justify-content:space-between;}
.legend-labels span{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted);}

/* ZOOM controls */
.zoom-btns{
  position:absolute;top:20px;left:24px;
  display:flex;flex-direction:column;gap:4px;
}
.zoom-btn{
  width:32px;height:32px;
  background:rgba(13,17,23,.8);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  font-size:1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;backdrop-filter:blur(10px);
}
.zoom-btn:hover{border-color:var(--accent);color:var(--accent);}

/* EMPTY STATE */
.empty-state{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:40px 24px;text-align:center;gap:12px;
  color:var(--muted);
}
.empty-globe{font-size:3rem;opacity:.3;}
.empty-text{font-size:.85rem;line-height:1.6;}

/* LOADING */
#loadingBar{
  position:fixed;top:0;left:0;height:2px;
  background:var(--accent);
  box-shadow:0 0 10px var(--accent);
  transition:width .3s;z-index:9999;
}

/* TOAST */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);
  background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:8px 16px;
  font-size:.8rem;color:var(--text);
  z-index:9999;transition:transform .3s ease;
  pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0);}

/* METRIC COLORS */
.metric-gdp .bar-fill{background:linear-gradient(90deg,#1d4ed8,#60a5fa);}
.metric-pop .bar-fill{background:linear-gradient(90deg,#7c3aed,#a78bfa);}
.metric-life .bar-fill{background:linear-gradient(90deg,#065f46,#34d399);}
.metric-area .bar-fill{background:linear-gradient(90deg,#92400e,#fbbf24);}

@media(max-width:900px){
  .app{grid-template-columns:1fr;}
  .sidebar{display:none;}
}
</style>
</head>
<body>
<div id="loadingBar" style="width:0%"></div>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    World Data Explorer <span>/ Global Insights</span>
  </div>
  <div class="metrics" id="metricsBar">
    <button class="metric-btn active" data-metric="gdp">GDP</button>
    <button class="metric-btn" data-metric="population">Population</button>
    <button class="metric-btn" data-metric="lifeExpectancy">Life Expectancy</button>
    <button class="metric-btn" data-metric="area">Area</button>
  </div>
</header>

<div class="app">
  <div class="map-wrap" id="mapWrap">
    <div class="zoom-btns">
      <button class="zoom-btn" onclick="zoomIn()">+</button>
      <button class="zoom-btn" onclick="zoomOut()">−</button>
      <button class="zoom-btn" onclick="resetZoom()" title="Reset" style="font-size:.7rem;">⊙</button>
    </div>
    <div class="legend" id="legend">
      <div class="legend-title" id="legendTitle">GDP (USD)</div>
      <div class="legend-bar" id="legendBar"></div>
      <div class="legend-labels">
        <span id="legendMin">Low</span>
        <span id="legendMax">High</span>
      </div>
    </div>
  </div>

  <div class="sidebar" id="sidebar">
    <div class="empty-state" id="emptyState">
      <div class="empty-globe">🌍</div>
      <div class="empty-text">Hover or click any country<br>to explore its data</div>
    </div>
    <div id="countryDetail" style="display:none"></div>
  </div>
</div>

<div id="tooltip"></div>
<div class="toast" id="toast"></div>

  lifeExpectancy:{ label:"Life Expectancy", unit:"yrs", format:v=>`${v.toFixed(1)}yr`, colors:["#0f172a","#052e16","#065f46","#34d399","#d1fae5"], max:85 },

// ==================== STATE ====================
let currentMetric = "gdp";
let selectedCountry = null;
let geoData = null;
let svg, projection, path, g, zoom;
let width, height;

// ==================== INIT ====================
async function init() {
  updateLoadingBar(10);
  const mapWrap = document.getElementById('mapWrap');
  width = mapWrap.clientWidth;
  height = mapWrap.clientHeight;

  svg = d3.select('#mapWrap').append('svg')
    .attr('width', width).attr('height', height);

  zoom = d3.zoom()
    .scaleExtent([1, 8])
    .on('zoom', (e) => g.attr('transform', e.transform));
  svg.call(zoom);

  projection = d3.geoNaturalEarth1()
    .scale(width / 6.2)
    .translate([width / 2, height / 2]);

  path = d3.geoPath().projection(projection);
  g = svg.append('g');

  // Globe sphere
  g.append('path')
    .datum({type:'Sphere'})
    .attr('class','sphere')
    .attr('d', path);

  // Graticule
  g.append('path')
    .datum(d3.geoGraticule()())
    .attr('class','graticule')
    .attr('d', path);

  updateLoadingBar(30);

  try {
    const res = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json');
    const topo = await res.json();
    updateLoadingBar(70);
    const countries110 = topojson.feature(topo, topo.objects.countries);
    geoData = countries110;
    drawMap();
    updateLoadingBar(100);
    setTimeout(() => document.getElementById('loadingBar').style.opacity = 0, 500);
  } catch(e) {
    console.error(e);
    showToast('Using simplified map data');
    loadFallback();
  }
}

// Minimal topojson feature extractor
function topojson_feature(topology, object) {
  const arcs = topology.arcs;
  function line(arc) {
    const idx = arc < 0 ? ~arc : arc;
    const a = arcs[idx];
    const coords = [];
    let x = 0, y = 0;
    for (const [dx, dy] of a) {
      x += dx; y += dy;
      coords.push([x * topology.transform.scale[0] + topology.transform.translate[0],
                   y * topology.transform.scale[1] + topology.transform.translate[1]]);
    }
    return arc < 0 ? coords.reverse() : coords;
  }
  function ring(arcs) { return arcs.flatMap(line); }
  function polygon(rings) { return rings.map(ring); }

  const features = object.geometries.map(geo => {
    let coordinates;
    if (geo.type === 'Polygon') coordinates = polygon(geo.arcs);
    else if (geo.type === 'MultiPolygon') coordinates = geo.arcs.map(polygon);
    return {
      type:'Feature',
      id: geo.id,
      properties: geo.properties || {},
      geometry: { type: geo.type, coordinates }
    };
  });
  return { type:'FeatureCollection', features };
}

function updateLoadingBar(pct) {
  document.getElementById('loadingBar').style.width = pct + '%';
}

// ==================== DRAW MAP ====================
function drawMap() {
  if (!geoData) return;
  const config = METRIC_CONFIG[currentMetric];

  // Color scale
  const values = Object.values(COUNTRIES_DATA).map(d => d[currentMetric]);
  const colorScale = d3.scaleQuantile()
    .domain(values)
    .range(config.colors);

  // Draw countries
  g.selectAll('.country').remove();
  g.selectAll('.country')
    .data(geoData.features)
    .enter().append('path')
    .attr('class', d => {
      const iso3 = getISO3(d.id);
      return 'country' + (selectedCountry === iso3 ? ' selected' : '');
    })
    .attr('d', path)
    .attr('fill', d => {
      const iso3 = getISO3(d.id);
      const country = COUNTRIES_DATA[iso3];
      if (!country) return '#1a2035';
      return colorScale(country[currentMetric]);
    })
    .on('mousemove', onMouseMove)
    .on('mouseleave', onMouseLeave)
    .on('click', onClick);

  updateLegend();
}

  const numToIso2 = {

// ==================== INTERACTIONS ====================
function onMouseMove(event, d) {
  const iso3 = getISO3(d.id);
  const country = iso3 ? COUNTRIES_DATA[iso3] : null;
  if (!country) return;

  const config = METRIC_CONFIG[currentMetric];
  const tooltip = document.getElementById('tooltip');
  tooltip.innerHTML = `
    <div class="tip-name"><span class="tip-flag">${country.flag}</span>${country.name}</div>
    <div class="tip-row">
      <span class="tip-label">GDP</span>
      <span class="tip-val">$${country.gdp.toFixed(0)}B</span>
    </div>
    <div class="tip-row">
      <span class="tip-label">Population</span>
      <span class="tip-val">${country.population.toFixed(1)}M</span>
    </div>
    <div class="tip-row">
      <span class="tip-label">Life Exp.</span>
      <span class="tip-val">${country.lifeExpectancy.toFixed(1)} yrs</span>
    </div>
  `;
  tooltip.style.left = event.clientX + 'px';
  tooltip.style.top = event.clientY + 'px';
  tooltip.classList.add('show');
}

function onMouseLeave() {
  document.getElementById('tooltip').classList.remove('show');
}

function onClick(event, d) {
  const iso3 = getISO3(d.id);
  if (!iso3 || !COUNTRIES_DATA[iso3]) return;
  selectedCountry = iso3;
  drawMap();
  showCountryDetail(iso3);
}

// ==================== SIDEBAR ====================
function showCountryDetail(iso3) {
  const c = COUNTRIES_DATA[iso3];
  if (!c) return;
  document.getElementById('emptyState').style.display = 'none';
  const detail = document.getElementById('countryDetail');
  detail.style.display = 'block';

  const allGdp = Object.values(COUNTRIES_DATA).map(x=>x.gdp).sort((a,b)=>b-a);
  const allPop = Object.values(COUNTRIES_DATA).map(x=>x.population).sort((a,b)=>b-a);
  const allLife = Object.values(COUNTRIES_DATA).map(x=>x.lifeExpectancy).sort((a,b)=>b-a);
  const allArea = Object.values(COUNTRIES_DATA).map(x=>x.area).sort((a,b)=>b-a);

  const gdpRank = allGdp.indexOf(c.gdp) + 1;
  const popRank = allPop.indexOf(c.population) + 1;
  const lifeRank = allLife.indexOf(c.lifeExpectancy) + 1;
  const areaRank = allArea.indexOf(c.area) + 1;

  const maxGdp = allGdp[0], maxPop = allPop[0], maxLife = allLife[0], maxArea = allArea[0];

  detail.innerHTML = `
    <div class="detail-header">
      <div class="detail-flag">${c.flag}</div>
      <div class="detail-name">${c.name}</div>
      <div class="detail-region">${c.region}</div>
    </div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">GDP</div>
        <div class="stat-val">$${c.gdp.toFixed(0)}B</div>
        <div class="stat-sub">Rank #${gdpRank}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Population</div>
        <div class="stat-val">${c.population.toFixed(1)}M</div>
        <div class="stat-sub">Rank #${popRank}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Life Expectancy</div>
        <div class="stat-val">${c.lifeExpectancy.toFixed(1)}</div>
        <div class="stat-sub">years · Rank #${lifeRank}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Area</div>
        <div class="stat-val">${c.area.toFixed(0)}k</div>
        <div class="stat-sub">km² · Rank #${areaRank}</div>
      </div>
    </div>

    <div class="bar-row metric-gdp">
      <div class="bar-label"><span>GDP vs World Max</span><span>$${c.gdp.toFixed(0)}B</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(c.gdp/maxGdp*100).toFixed(1)}%"></div></div>
    </div>
    <div class="bar-row metric-pop" style="margin-top:10px">
      <div class="bar-label"><span>Population vs Max</span><span>${c.population.toFixed(1)}M</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(c.population/maxPop*100).toFixed(1)}%"></div></div>
    </div>
    <div class="bar-row metric-life" style="margin-top:10px">
      <div class="bar-label"><span>Life Expectancy</span><span>${c.lifeExpectancy.toFixed(1)} yrs</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(c.lifeExpectancy/maxLife*100).toFixed(1)}%"></div></div>
    </div>
    <div class="bar-row metric-area" style="margin-top:10px;margin-bottom:20px">
      <div class="bar-label"><span>Area vs Largest</span><span>${c.area.toFixed(0)}k km²</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(c.area/maxArea*100).toFixed(1)}%"></div></div>
    </div>

    ${renderTopList()}
  `;
}

function renderTopList() {
  const config = METRIC_CONFIG[currentMetric];
  const sorted = Object.entries(COUNTRIES_DATA)
    .sort((a,b) => b[1][currentMetric] - a[1][currentMetric])
    .slice(0,10);

  return `
    <div class="rank-section">
      <div class="rank-title">Top 10 by ${config.label}</div>
      ${sorted.map(([iso,c], i) => `
        <div class="rank-item" onclick="selectCountry('${iso}')">
          <span class="rank-num">${i+1}</span>
          <span class="rank-flag">${c.flag}</span>
          <span class="rank-name">${c.name}</span>
          <span class="rank-val">${config.format(c[currentMetric])}</span>
        </div>
      `).join('')}
    </div>
  `;
}

function selectCountry(iso3) {
  selectedCountry = iso3;
  drawMap();
  showCountryDetail(iso3);
}

// ==================== LEGEND ====================
function updateLegend() {
  const config = METRIC_CONFIG[currentMetric];
  document.getElementById('legendTitle').textContent = config.label;
  document.getElementById('legendBar').style.background =
    `linear-gradient(to right, ${config.colors.join(',')})`;

  const values = Object.values(COUNTRIES_DATA).map(d => d[currentMetric]);
  const mn = Math.min(...values), mx = Math.max(...values);
  document.getElementById('legendMin').textContent = config.format(mn);
  document.getElementById('legendMax').textContent = config.format(mx);
}

// ==================== ZOOM ====================
function zoomIn() { svg.transition().call(zoom.scaleBy, 1.5); }
function zoomOut() { svg.transition().call(zoom.scaleBy, 0.67); }
function resetZoom() { svg.transition().call(zoom.transform, d3.zoomIdentity); }

// ==================== METRIC SWITCH ====================
document.getElementById('metricsBar').addEventListener('click', e => {
  const btn = e.target.closest('.metric-btn');
  if (!btn) return;
  document.querySelectorAll('.metric-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentMetric = btn.dataset.metric;
  drawMap();
  if (selectedCountry) showCountryDetail(selectedCountry);
});

// ==================== TOAST ====================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ==================== RESIZE ====================
window.addEventListener('resize', () => {
  const mapWrap = document.getElementById('mapWrap');
  width = mapWrap.clientWidth;
  height = mapWrap.clientHeight;
  svg.attr('width', width).attr('height', height);
  projection.scale(width / 6.2).translate([width/2, height/2]);
  path = d3.geoPath().projection(projection);
  drawMap();
});

// ==================== LOAD FALLBACK ====================
function loadFallback() {
  showToast('Map data loaded');
  updateLoadingBar(100);
  document.getElementById('loadingBar').style.opacity = 0;
  // Show sidebar with ranking even without map
  document.getElementById('emptyState').innerHTML = `
    <div class="empty-globe">🌍</div>
    <div class="empty-text">Map data unavailable.<br>Browse rankings below.</div>
  `;
}

// Start
init();
</script>
